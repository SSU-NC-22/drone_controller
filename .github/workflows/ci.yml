name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: AST-parse all scripts (no ROS required)
        # The scripts import rospy / mavros_msgs / Jetson.GPIO, which are only
        # available inside a ROS Noetic + MAVROS install, so we cannot `import`
        # them in CI. AST-parsing each file syntax-checks it without importing.
        run: |
          python - <<'PY'
          import ast, glob, sys
          fails = 0
          for f in sorted(glob.glob('scripts/*.py')):
              try:
                  ast.parse(open(f).read(), filename=f)
                  print('OK', f)
              except SyntaxError as e:
                  print('SYNTAX ERROR', f, e)
                  fails += 1
          sys.exit(1 if fails else 0)
          PY
